name: Workshop validation
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/test.js --test-concurrency=4 'tests/*.test.js'
      - run: docker build --tag workshop-deployment-check .
      - run: node scripts/container-smoke.js
